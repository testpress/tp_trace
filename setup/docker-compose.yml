services:

  tempo:
    image: grafana/tempo:2.4.1
    container_name: obs-tempo
    restart: on-failure:5

    command:
      - "-config.file=/etc/tempo/tempo.yaml"

    environment:
      # ~80% of the 2G container limit so Go's GC backs off before the kernel OOM-kills it
      - GOMEMLIMIT=1600MiB

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/lib/tempo

    ports:
      # Remote collector pushes traces here
      - "4327:4317"
      - "4328:4318"
      # Query API (Grafana / operators)
      - "3200:3200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 -O- http://localhost:3200/ready || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    networks:
      - observability_net


volumes:
  tempo_data:


networks:
  observability_net:
    driver: bridge
