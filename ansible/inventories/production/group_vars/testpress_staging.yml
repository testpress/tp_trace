# Variables specific to the `testpress_staging` cluster group.
# Hosts: staging1 (the observability host running Tempo + Prometheus)
# Note: staging1 also hosts central observability infrastructure; account for
# host-level memory and CPU pressure when adjusting collector container limits.
# Values here override or supplement `group_vars/app_servers.yml`.

# Example: testpress_staging-specific container resources
# otel_collector_container_cpu_limit: 1.0
# otel_collector_container_memory_limit: "1024m"
