---
# Variables specific to the `app_servers` group for the local environment.
# Values here override or supplement production defaults; endpoints point to
# the locally-run stack (docker-compose) on localhost.
# See dev/docker-compose.yml for the exposed ports.

otel_collector_otlp_grpc_bind: "0.0.0.0"
otel_collector_otlp_http_bind: "0.0.0.0"
otel_collector_tempo_endpoint: "127.0.0.1:4317"
otel_collector_prometheus_remote_write_endpoint: "http://127.0.0.1:9090/api/v1/write"
otel_collector_observability_host: "localhost"

# Allowed source IPs/CIDRs for OTLP ingress (4317/4318) and observability push
# ports (4327/9090). Local testing only needs loopback.
otel_collector_allowed_hosts_common:
  - 127.0.0.1/32

otel_collector_allowed_hosts_extra: []
