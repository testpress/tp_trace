---
- name: Preseed iptables-persistent autosave prompts
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: boolean
  loop:
    - question: iptables-persistent/autosave_v4
      value: "true"
    - question: iptables-persistent/autosave_v6
      value: "true"
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Check if Docker is already installed
  ansible.builtin.command: which docker
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker Python bindings
  ansible.builtin.apt:
    name:
      - python3-docker
    state: present
    update_cache: true

- name: Install iptables-persistent
  ansible.builtin.apt:
    name:
      - iptables-persistent
    state: present
    update_cache: true
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Install Docker if not present
  ansible.builtin.apt:
    name: docker.io
    state: present
  when: docker_check.rc != 0

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Allow application users to manage Docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ otel_collector_docker_users }}"
  when: not ansible_check_mode

