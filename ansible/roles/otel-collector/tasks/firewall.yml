---
- name: Build effective OpenTelemetry Collector firewall sources
  ansible.builtin.set_fact:
    otel_collector_effective_allowed_hosts: >-
      {{ configured_sources | select('in', selected_sources) | list
         if ansible_limit is defined else configured_sources }}
  vars:
    configured_sources: "{{ otel_collector_allowed_hosts_common + otel_collector_allowed_hosts_extra }}"
    selected_sources: >-
      {{ ['127.0.0.1/32'] + (ansible_play_hosts_all | map('extract', hostvars)
         | selectattr('ansible_host', 'defined') | map(attribute='ansible_host')
         | map('regex_replace', '$', '/32') | list) }}
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Ensure OpenTelemetry Collector OTLP firewall rules are present
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ (otel_collector_effective_allowed_hosts | default([])) | product(otel_collector_otlp_ingress_ports | default([])) | list }}"
  when: otel_collector_firewall_enabled | default(true) | bool
  notify: Save iptables rules

- name: Allow monitoring sources to reach Collector health endpoint
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "13133"
    source: "{{ item }}"
    jump: ACCEPT
    action: insert
    state: present
  # Monitoring sources must survive --limit to an individual Collector host.
  loop: "{{ otel_collector_health_allowed_hosts }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_health_enabled | bool
  notify: Save iptables rules

- name: Ensure Docker user chain exists
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    state: present
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in Docker user chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ (otel_collector_effective_allowed_hosts | default([])) | product(otel_collector_observability_ingress_ports | default([])) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in INPUT chain
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ (otel_collector_effective_allowed_hosts | default([])) | product(otel_collector_observability_ingress_ports | default([])) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules
