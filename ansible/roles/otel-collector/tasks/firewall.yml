---
- name: Validate OpenTelemetry Collector firewall variables
  ansible.builtin.assert:
    that:
      - (otel_collector_allowed_hosts_common | default([]) + otel_collector_allowed_hosts_extra | default([])) | length > 0
      - otel_collector_otlp_ingress_ports | length > 0
    fail_msg: OpenTelemetry Collector firewall variables are incomplete. Check group_vars.
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Build effective OpenTelemetry Collector firewall sources
  ansible.builtin.set_fact:
    otel_collector_effective_allowed_hosts: >-
      {{ configured_sources | select('in', selected_sources) | list
         if ansible_limit is defined else configured_sources }}
  vars:
    configured_sources: "{{ otel_collector_allowed_hosts_common + otel_collector_allowed_hosts_extra }}"
    selected_sources: >-
      {{ ansible_play_hosts_all | reject('equalto', inventory_hostname)
         | map('extract', hostvars, 'ansible_host') | map('regex_replace', '$', '/32') | list }}
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Ensure OpenTelemetry Collector OTLP firewall rules are present
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_otlp_ingress_ports) | list }}"
  when: otel_collector_firewall_enabled | default(true) | bool
  notify: Save iptables rules

- name: Ensure Docker user chain exists
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    state: present
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in Docker user chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in INPUT chain
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules
