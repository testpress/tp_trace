---
- name: Build effective OpenTelemetry Collector variables
  ansible.builtin.set_fact:
    otel_collector_effective_allowed_hosts: "{{ otel_collector_allowed_hosts_common + otel_collector_allowed_hosts_extra }}"

- name: Ensure OpenTelemetry Collector configuration directory exists
  ansible.builtin.file:
    path: "{{ otel_collector_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy shared OpenTelemetry Collector configuration
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../config/otel-collector.yaml"
    dest: "{{ otel_collector_config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: otel_collector_config

- name: Ensure OpenTelemetry Collector container is running
  community.docker.docker_container:
    name: "{{ otel_collector_container_name }}"
    image: "{{ otel_collector_image }}"
    state: started
    restart: "{{ otel_collector_config is changed }}"
    restart_policy: unless-stopped
    network_mode: "{{ otel_collector_network_mode }}"
    cpus: "{{ otel_collector_container_cpu_limit }}"
    memory: "{{ otel_collector_container_memory_limit }}"
    env:
      GOMEMLIMIT: "{{ otel_collector_gomemlimit }}"
      GOGC: "{{ otel_collector_gogc }}"
      OTEL_COLLECTOR_ALIAS: "{{ otel_collector_alias | string }}"
      OTEL_COLLECTOR_BATCH_MAX_SIZE: "{{ (otel_collector_batch_max_size | string) if otel_collector_batch_max_size is defined else omit }}"
      OTEL_COLLECTOR_BATCH_SEND_SIZE: "{{ (otel_collector_batch_send_size | string) if otel_collector_batch_send_size is defined else omit }}"
      OTEL_COLLECTOR_BATCH_TIMEOUT: "{{ (otel_collector_batch_timeout | string) if otel_collector_batch_timeout is defined else omit }}"
      OTEL_COLLECTOR_DELTATOCUMULATIVE_MAX_STALE: "{{ (otel_collector_deltatocumulative_max_stale | string) if otel_collector_deltatocumulative_max_stale is defined else omit }}"
      OTEL_COLLECTOR_DELTATOCUMULATIVE_MAX_STREAMS: "{{ (otel_collector_deltatocumulative_max_streams | string) if otel_collector_deltatocumulative_max_streams is defined else omit }}"
      OTEL_COLLECTOR_INSTANCE: "{{ otel_collector_instance | string }}"
      OTEL_COLLECTOR_INTERNAL_METRICS_BIND: "{{ otel_collector_internal_metrics_bind | string }}"
      OTEL_COLLECTOR_INTERNAL_METRICS_PORT: "{{ otel_collector_internal_metrics_port | string }}"
      OTEL_COLLECTOR_LOG_LEVEL: "{{ (otel_collector_log_level | string) if otel_collector_log_level is defined else omit }}"
      OTEL_COLLECTOR_MEMORY_LIMIT_MIB: "{{ (otel_collector_memory_limit_mib | string) if otel_collector_memory_limit_mib is defined else omit }}"
      OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB: "{{ (otel_collector_memory_spike_limit_mib | string) if otel_collector_memory_spike_limit_mib is defined else omit }}"
      OTEL_COLLECTOR_OTLP_GRPC_BIND: "{{ otel_collector_otlp_grpc_bind | string }}"
      OTEL_COLLECTOR_OTLP_GRPC_PORT: "{{ otel_collector_otlp_grpc_port | string }}"
      OTEL_COLLECTOR_OTLP_HTTP_BIND: "{{ otel_collector_otlp_http_bind | string }}"
      OTEL_COLLECTOR_OTLP_HTTP_PORT: "{{ otel_collector_otlp_http_port | string }}"
      OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_ENDPOINT: "{{ otel_collector_prometheus_remote_write_endpoint | string }}"
      OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_NUM_CONSUMERS: "{{ (otel_collector_prometheus_remote_write_num_consumers | string) if otel_collector_prometheus_remote_write_num_consumers is defined else omit }}"
      OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_QUEUE_SIZE: "{{ (otel_collector_prometheus_remote_write_queue_size | string) if otel_collector_prometheus_remote_write_queue_size is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_ENDPOINT: "{{ otel_collector_tempo_endpoint | string }}"
      OTEL_COLLECTOR_TEMPO_QUEUE_NUM_CONSUMERS: "{{ (otel_collector_tempo_queue_num_consumers | string) if otel_collector_tempo_queue_num_consumers is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_QUEUE_SIZE: "{{ (otel_collector_tempo_queue_size | string) if otel_collector_tempo_queue_size is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_RETRY_ENABLED: "{{ (otel_collector_tempo_retry_enabled | string | lower) if otel_collector_tempo_retry_enabled is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_RETRY_INITIAL_INTERVAL: "{{ (otel_collector_tempo_retry_initial_interval | string) if otel_collector_tempo_retry_initial_interval is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_RETRY_MAX_ELAPSED_TIME: "{{ (otel_collector_tempo_retry_max_elapsed_time | string) if otel_collector_tempo_retry_max_elapsed_time is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_RETRY_MAX_INTERVAL: "{{ (otel_collector_tempo_retry_max_interval | string) if otel_collector_tempo_retry_max_interval is defined else omit }}"
      OTEL_COLLECTOR_TEMPO_TLS_INSECURE: "{{ (otel_collector_tempo_tls_insecure | string | lower) if otel_collector_tempo_tls_insecure is defined else omit }}"
    log_driver: json-file
    log_options:
      max-size: "{{ otel_collector_log_max_size }}"
      max-file: "{{ otel_collector_log_max_file }}"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - "{{ otel_collector_config_file }}:/etc/otelcol-contrib/config.yaml:ro"
  when: not ansible_check_mode

- name: Ensure OpenTelemetry Collector OTLP firewall rules are present
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_otlp_ingress_ports) | list }}"
  when: otel_collector_firewall_enabled | default(true) | bool
  notify: Save iptables rules

- name: Ensure Docker user chain exists
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    state: present
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in Docker user chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in INPUT chain
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

