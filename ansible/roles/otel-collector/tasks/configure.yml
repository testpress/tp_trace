---
- name: Build effective OpenTelemetry Collector variables
  ansible.builtin.set_fact:
    otel_collector_effective_allowed_hosts: "{{ otel_collector_allowed_hosts_common + otel_collector_allowed_hosts_extra }}"

- name: Ensure OpenTelemetry Collector configuration directory exists
  ansible.builtin.file:
    path: "{{ otel_collector_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render OpenTelemetry Collector configuration
  ansible.builtin.template:
    src: otel-collector-config.yaml.j2
    dest: "{{ otel_collector_config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: otel_collector_config

- name: Ensure OpenTelemetry Collector container is running
  community.docker.docker_container:
    name: "{{ otel_collector_container_name }}"
    image: "{{ otel_collector_image }}"
    state: started
    restart: "{{ otel_collector_config is changed }}"
    restart_policy: unless-stopped
    network_mode: "{{ otel_collector_network_mode }}"
    cpus: "{{ otel_collector_container_cpu_limit }}"
    memory: "{{ otel_collector_container_memory_limit }}"
    env:
      GOMEMLIMIT: "{{ otel_collector_gomemlimit }}"
      GOGC: "{{ otel_collector_gogc }}"
    log_driver: json-file
    log_options:
      max-size: "{{ otel_collector_log_max_size }}"
      max-file: "{{ otel_collector_log_max_file }}"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - "{{ otel_collector_config_file }}:/etc/otelcol-contrib/config.yaml:ro"
  when: not ansible_check_mode

- name: Ensure OpenTelemetry Collector OTLP firewall rules are present
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_otlp_ingress_ports) | list }}"
  when: otel_collector_firewall_enabled | default(true) | bool
  notify: Save iptables rules

- name: Ensure Docker user chain exists
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    state: present
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in Docker user chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

- name: Ensure Observability Host push firewall rules are present in INPUT chain
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item.1 | string }}"
    source: "{{ item.0 }}"
    jump: ACCEPT
    action: append
    state: present
  loop: "{{ otel_collector_effective_allowed_hosts | product(otel_collector_observability_ingress_ports) | list }}"
  when:
    - otel_collector_firewall_enabled | default(true) | bool
    - otel_collector_observability_host | default('') | length > 0
    - inventory_hostname == otel_collector_observability_host
  notify: Save iptables rules

