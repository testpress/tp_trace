---
- name: Validate OpenTelemetry Collector prerequisites
  ansible.builtin.import_tasks: validate.yml

- name: Validate OpenTelemetry Collector firewall variables
  ansible.builtin.assert:
    that:
      - (otel_collector_allowed_hosts_common | default([]) + otel_collector_allowed_hosts_extra | default([])) | length > 0
      - otel_collector_otlp_ingress_ports | length > 0
    fail_msg: OpenTelemetry Collector firewall variables are incomplete. Check group_vars.
  when: otel_collector_firewall_enabled | default(true) | bool

- name: Install and prepare Docker
  ansible.builtin.import_tasks: install.yml

- name: Configure OpenTelemetry Collector
  ansible.builtin.import_tasks: configure.yml

- name: Configure OpenTelemetry Collector firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Verify OpenTelemetry Collector
  ansible.builtin.import_tasks: verify.yml
