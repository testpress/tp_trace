receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 500ms
    limit_mib: 512
    spike_limit_mib: 100
  resource/drop_ephemeral:
    attributes:
    - key: service.instance.id
      action: delete
    - key: process.pid
      action: delete
  transform/spanmetrics_route:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["http.route"], attributes["http.route_template"]) where attributes["http.route_template"] != nil
  batch:
    timeout: 500ms
    send_batch_size: 256
    send_batch_max_size: 512
connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets:
        - 2ms
        - 5ms
        - 10ms
        - 25ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2.5s
        - 5s
    dimensions:
    - name: http.method
    - name: http.status_code
    - name: http.route
    - name: db.system
    - name: db.operation
    - name: server.address
    - name: server.port
    - name: error
    - name: span.type
    - name: normalized.service
    - name: normalized.operation
    - name: institute.subdomain
    - name: institute
    dimensions_cache_size: 5000
exporters:
  otlp/tempo:
    # TEMPO_OTLP_ENDPOINT must be set in every deployment; the collector has no
    # built-in default for ${env:...} expansion. Local dev sets it to `tempo:4317`,
    # production sets it to the observability host (e.g. tempo.obs.internal:4317).
    endpoint: tempo.tracenest.orb.local:4317
    tls:
      insecure: true
    # Wide-area link: allow the export to outlive a slow/unreachable Tempo.
    timeout: 10s
    sending_queue:
        enabled: true
        num_consumers: 4
        queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: apm
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/drop_ephemeral
      - batch
      exporters:
      - otlp/tempo
    traces/spanmetrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/drop_ephemeral
      - transform/spanmetrics_route
      - batch
      exporters:
      - spanmetrics
    metrics:
      receivers:
      - otlp
      - spanmetrics
      processors:
      - memory_limiter
      - resource/drop_ephemeral
      - batch
      exporters:
      - prometheus
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
