global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "otel-collector-spanmetrics"
    scrape_interval: 10s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "apm_traces_service_graph_(.*)"
        target_label: __name__
        replacement: "traces_service_graph_$1"

  - job_name: "prometheus"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          source: "prometheus"

  - job_name: "tempo"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "65.21.236.56:3200"
        labels:
          source: "tempo"
