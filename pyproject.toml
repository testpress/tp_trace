[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tp_trace"
version = "0.2.0"
description = "tp_trace: High-performance Python Observability SDK for OpenTelemetry"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-requests>=0.44b0",
    "opentelemetry-instrumentation-psycopg2>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    "opentelemetry-instrumentation-botocore>=0.44b0",
    "opentelemetry-instrumentation-celery>=0.54b1",
    "opentelemetry-instrumentation-django>=0.44b0",
    "wrapt>=1.14.0",
    "urllib3>=1.26.0,<2; python_version < '3.9'",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
    "opentelemetry-instrumentation-django>=0.44b0",
]
dev = [
    "pytest>=7.0.0",
    "botocore>=1.37.38",
    "build>=1.0.0",
    "requests>=2.25.0",
    # Redis client for the Redis integration tests: the wiring tests need the
    # package, and the end-to-end tests additionally run against a local
    # redis server (they skip when no server is reachable).
    "redis>=3.5.0",
    # Celery client for the Celery integration tests
    "celery>=5.0",
    # tests/conftest.py configures Django, so the documented
    # `pip install -e '.[dev]'` + `pytest` flow needs it here. Unpinned above
    # 4.2 so the resolver follows the interpreter: on Python 3.8 (the
    # sample-app / backend target) this resolves to the 4.2 LTS, while newer
    # interpreters get the matching current release.
    "django>=4.2",
    "ruff>=0.1.0",
    "mypy>=1.0.0; python_version >= '3.10'",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
# Keep bare `pytest`/`pytest .` from wandering outside the suite if another
# throwaway scripts directory (or a vendored copy of tests) is ever added.
norecursedirs = ["scratch", "*.egg", ".*", "build", "dist", "node_modules"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
