apiVersion: 1

datasources:
  - name: Prometheus
    uid: _IY366MMk
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 3
    editable: true
    jsonData:
      timeInterval: 1m
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    version: 3
    editable: true
    jsonData:
      httpMethod: GET
      defaultQueryType: search
      tracesToMetrics:
        datasourceUid: _IY366MMk
        tags: [{ key: 'service.name', value: 'project_name' }, { key: 'job' }]
        queries:
          - name: 'Throughput'
            query: 'sum(rate(apm_calls_total{$$__tags}[$$__rate_interval]))'
          - name: 'Latency (p95)'
            query: 'histogram_quantile(0.95, sum(rate(apm_duration_milliseconds_bucket{$$__tags}[$$__rate_interval])) by (le))'
      serviceMap:
        datasourceUid: _IY366MMk
      search:
        hide: false
      nodeGraph:
        enabled: true
