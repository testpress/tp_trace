global:
  scrape_interval: 5s
  evaluation_interval: 15s

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["tempo:3200"]
