# Shared by local Compose and Ansible. Change pipeline behavior here.
extensions:
  health_check:
    endpoint: ${env:OTEL_COLLECTOR_HEALTH_BIND:-127.0.0.1}:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_GRPC_BIND:-127.0.0.1}:${env:OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}
      http:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_BIND:-127.0.0.1}:${env:OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}

  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:${env:OTEL_COLLECTOR_INTERNAL_METRICS_PORT:-8888}"]
              labels:
                source: "otelcol-telemetry"
                instance: "${env:OTEL_COLLECTOR_INSTANCE}"
                collector_alias: "${env:OTEL_COLLECTOR_ALIAS}"

connectors:
  spanmetrics:
    namespace: apm
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    histogram:
      unit: ms
      explicit:
        buckets:
          - 5ms
          - 25ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2.5s
          - 5s
    dimensions:
      - name: http.method
        default: ""
      - name: http.status_code
        default: ""
      - name: http.route
        default: ""
      - name: db.system
        default: ""
      - name: db.operation
        default: ""
      - name: db.instance
        default: ""
      # SDK pool identity is bounded; leave direct connections without this label.
      - name: db.connection.pool
      - name: error
        default: ""
      - name: normalized.service
        default: ""
      - name: normalized.operation
        default: ""
    exclude_dimensions:
      - span.name
    # Stop exporting a resource's metrics once it stops sending spans (e.g. after deploy).
    metrics_expiration: 5m
    series_expiration: 5m
    # Bound combinations within each resource aggregation (not a global series cap).
    aggregation_cardinality_limit: 5000

processors:
  memory_limiter:
    check_interval: 500ms
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-400}
    spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-80}

  # Deploy before enabling delta SDK exports. Preserve datapoint worker_id.
  # max_streams bounds state; new streams over the limit are dropped.
  deltatocumulative:
    max_stale: ${env:OTEL_COLLECTOR_DELTATOCUMULATIVE_MAX_STALE:-5m}
    max_streams: ${env:OTEL_COLLECTOR_DELTATOCUMULATIVE_MAX_STREAMS:-50000}

  resource/drop_ephemeral:
    attributes:
      - key: service.instance.id
        action: delete
      - key: process.pid
        action: delete
      # This removes only the resource key. N+1 datapoint worker_id must stay.
      - key: worker_id
        action: delete
      - key: telemetry.sdk.version
        action: delete
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.name
        action: delete

  # Remove tenant resource labels only on metric paths; keep them in Tempo.
  resource/drop_metric_institute:
    attributes:
      - key: institute
        action: delete
      - key: institute.subdomain
        action: delete

  # Drop internal framework spans from spanmetrics to prevent duplicate RED signals
  filter/spanmetrics_drop_internal:
    error_mode: ignore
    trace_conditions:
      - 'span.kind == SPAN_KIND_INTERNAL'

  # Tail sampling buffers spans and evaluates policies over the entire trace.
  # This guarantees full parent-child hierarchy retention for error traces,
  # SDK-sampled traces, and repeated-query traces without orphan spans.
  #
  # Sizing & Memory Budget:
  # - Statefulness: Tail sampling buffers all spans of in-flight traces until
  #   decision_wait expires. At expected_new_traces_per_sec=1000 and
  #   decision_wait=3s, steady state is ~3,000 in-flight traces.
  # - Memory budget: The Collector memory limiter enforces a 400 MiB hard limit
  #   (limit_mib) with an 80 MiB spike threshold, giving an effective 320 MiB soft
  #   limit. Other components (spanmetrics connector, deltatocumulative, batch
  #   processors, Go GC headroom) consume ~180-200 MiB under load, leaving a
  #   safe budget of ~100-125 MiB for tail sampling.
  # - Sizing: Typical traces (15-30 spans with DB/Redis/HTTP attributes) occupy
  #   ~20-25 KB in Go heap. num_traces=5000 caps buffer memory at ~100-125 MiB,
  #   providing ~66% burst headroom over the 3,000 trace steady state.
  # - Trade-off: Bursts exceeding 5,000 in-flight traces evict the oldest un-decided
  #   traces (tracked by otelcol_processor_tail_sampling_sampling_trace_dropped_too_early).
  #   This sheds trace detail under extreme spikes while strictly preventing
  #   memory_limiter from tripping and refusing data on the shared spanmetrics pipeline.
  # - Late spans & decision cache: Spans arriving after decision_wait inherit the cached
  #   decision from decision_cache. If a long-running trace (>3s) encounters an error
  #   after the initial drop decision, the late error span is dropped.
  tail_sampling:
    decision_wait: ${env:OTEL_COLLECTOR_TAIL_SAMPLING_DECISION_WAIT:-3s}
    num_traces: ${env:OTEL_COLLECTOR_TAIL_SAMPLING_NUM_TRACES:-5000}
    expected_new_traces_per_sec: ${env:OTEL_COLLECTOR_TAIL_SAMPLING_EXPECTED_NEW_TRACES_PER_SEC:-1000}
    decision_cache:
      sampled_cache_size: ${env:OTEL_COLLECTOR_TAIL_SAMPLING_SAMPLED_CACHE_SIZE:-2500}
      non_sampled_cache_size: ${env:OTEL_COLLECTOR_TAIL_SAMPLING_NON_SAMPLED_CACHE_SIZE:-5000}
    policies:
      # Keep 50% of whole traces if ANY span in the trace has an error status
      - name: errors
        type: and
        and:
          and_sub_policy:
            - name: has_error
              type: status_code
              status_code:
                status_codes:
                  - ERROR
            - name: error_probabilistic
              type: probabilistic
              probabilistic:
                sampling_percentage: 50.0

      # Keep whole trace if SDK explicitly marked it as sampled
      - name: sampled_by_attribute
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.attributes["tp_trace.sampled"] == true'

      # Keep whole trace if non-tp_trace producer wire flags indicate sampled
      - name: sampled_by_wire_flags
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.attributes["tp_trace.sampled"] == nil and (span.flags - (span.flags / 2) * 2) != 0'

      # Repeated query evidence: sample whole traces exhibiting repeated query detection
      - name: repeated_query_evidence
        type: and
        and:
          and_sub_policy:
            - name: has_repeated_query
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'span.attributes["repeated_query.detected"] == true'
            - name: repeated_query_probabilistic
              type: probabilistic
              probabilistic:
                sampling_percentage: 1.0

  # Route normalization for spanmetrics
  transform/spanmetrics_route:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["http.route"], attributes["http.route_template"]) where attributes["http.route_template"] != nil
          - set(attributes["http.route"], attributes["django.route"]) where attributes["http.route_template"] == nil and attributes["django.route"] != nil
          - set(attributes["http.route"], "__unmatched__") where attributes["http.route_template"] == nil and attributes["django.route"] == nil and attributes["http.route"] != nil

  # Metric-only error, HTTP status, and database normalization.
  transform/spanmetrics_sanitize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["error"], true) where attributes["error"] == nil and span.status.code == STATUS_CODE_ERROR
          - set(attributes["error"], false) where attributes["error"] == nil
          - set(attributes["http.status_code"], attributes["http.response.status_code"]) where attributes["http.status_code"] == nil and attributes["http.response.status_code"] != nil
          - delete_key(attributes, "http.route") where attributes["db.system"] != nil
          - delete_key(attributes, "http.method") where attributes["db.system"] != nil
          - set(attributes["normalized.operation"], attributes["db.query.summary"]) where attributes["normalized.operation"] == nil and attributes["db.query.summary"] != nil and attributes["db.system"] != nil
          - set(attributes["normalized.operation"], attributes["db.operation"]) where attributes["normalized.operation"] == nil and attributes["db.operation"] != nil

  batch:
    timeout: ${env:OTEL_COLLECTOR_BATCH_TIMEOUT:-500ms}
    send_batch_size: ${env:OTEL_COLLECTOR_BATCH_SEND_SIZE:-256}
    send_batch_max_size: ${env:OTEL_COLLECTOR_BATCH_MAX_SIZE:-512}

exporters:
  otlp/tempo:
    endpoint: ${env:OTEL_COLLECTOR_TEMPO_ENDPOINT}
    tls:
      insecure: ${env:OTEL_COLLECTOR_TEMPO_TLS_INSECURE:-true}
    timeout: 10s
    retry_on_failure:
      enabled: ${env:OTEL_COLLECTOR_TEMPO_RETRY_ENABLED:-true}
      initial_interval: ${env:OTEL_COLLECTOR_TEMPO_RETRY_INITIAL_INTERVAL:-1s}
      max_interval: ${env:OTEL_COLLECTOR_TEMPO_RETRY_MAX_INTERVAL:-30s}
      max_elapsed_time: ${env:OTEL_COLLECTOR_TEMPO_RETRY_MAX_ELAPSED_TIME:-300s}
    sending_queue:
      enabled: true
      num_consumers: ${env:OTEL_COLLECTOR_TEMPO_QUEUE_NUM_CONSUMERS:-8}
      queue_size: ${env:OTEL_COLLECTOR_TEMPO_QUEUE_SIZE:-5000}

  prometheusremotewrite:
    endpoint: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_ENDPOINT}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    remote_write_queue:
      enabled: true
      queue_size: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_QUEUE_SIZE:-1000}
      num_consumers: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_NUM_CONSUMERS:-1}
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      job: "otel-collector"
      instance: "${env:OTEL_COLLECTOR_INSTANCE}"
      collector_alias: "${env:OTEL_COLLECTOR_ALIAS}"

  prometheusremotewrite/internal:
    endpoint: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_ENDPOINT}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    remote_write_queue:
      enabled: true
      queue_size: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_QUEUE_SIZE:-1000}
      num_consumers: ${env:OTEL_COLLECTOR_PROMETHEUS_REMOTE_WRITE_NUM_CONSUMERS:-1}
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      job: "otel-collector"
      instance: "${env:OTEL_COLLECTOR_INSTANCE}"
      collector_alias: "${env:OTEL_COLLECTOR_ALIAS}"

service:
  # Local Compose opts in; deployed hosts do not open a new listener.
  extensions: ${env:OTEL_COLLECTOR_EXTENSIONS:-[]}
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/drop_ephemeral
        - tail_sampling
        - batch
      exporters:
        - otlp/tempo

    traces/spanmetrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/drop_ephemeral
        - resource/drop_metric_institute
        - filter/spanmetrics_drop_internal
        - transform/spanmetrics_route
        - transform/spanmetrics_sanitize
        - batch
      exporters:
        - spanmetrics

    metrics:
      receivers:
        - otlp
        - spanmetrics
      processors:
        - memory_limiter
        - resource/drop_ephemeral
        - resource/drop_metric_institute
        - deltatocumulative
        - batch
      exporters:
        - prometheusremotewrite

    metrics/internal:
      receivers:
        - prometheus/internal
      processors:
        - batch
      exporters:
        - prometheusremotewrite/internal

  telemetry:
    logs:
      level: ${env:OTEL_COLLECTOR_LOG_LEVEL:-info}
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTEL_COLLECTOR_INTERNAL_METRICS_BIND:-0.0.0.0}
                port: ${env:OTEL_COLLECTOR_INTERNAL_METRICS_PORT:-8888}
                without_type_suffix: false
                without_units: false
