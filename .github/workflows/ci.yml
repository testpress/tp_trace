name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/ tests/
      - run: python -m mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10' ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Install promtool
        run: |
          PROMETHEUS_VERSION="3.5.0"
          ARCHIVE="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          EXPECTED_SHA="e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
          mkdir -p "${HOME}/.local/bin"
          curl -sSL -o "${ARCHIVE}" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${ARCHIVE}"
          echo "${EXPECTED_SHA}  ${ARCHIVE}" | sha256sum -c -
          tar -xz --strip-components=1 -C "${HOME}/.local/bin" -f "${ARCHIVE}" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          rm -f "${ARCHIVE}"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - run: python -m pytest
      - run: python -m build
      - run: make check-config
