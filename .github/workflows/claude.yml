name: Claude Code

# Docs:    https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
# Example: https://github.com/anthropics/claude-code-action/blob/main/examples/claude.yml

env:
  CLAUDE_CODE_VERSION: 2.1.308

on:
  issue_comment:
    types: [created]

jobs:
  # pr-review.yml handles @claude review through its own issue_comment trigger.
  claude:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Restore Claude Code cache
        id: claude-code-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/claude-code/2.1.308/claude
          key: claude-code-${{ runner.os }}-${{ runner.arch }}-${{ env.CLAUDE_CODE_VERSION }}

      - name: Install Claude Code
        if: steps.claude-code-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          install -D -m 0755 \
            "$(readlink -f "$HOME/.local/bin/claude")" \
            "$RUNNER_TEMP/claude-code/$CLAUDE_CODE_VERSION/claude"

      - name: Verify Claude Code
        run: |
          test -x "$RUNNER_TEMP/claude-code/$CLAUDE_CODE_VERSION/claude"
          "$RUNNER_TEMP/claude-code/$CLAUDE_CODE_VERSION/claude" --version

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude-code/2.1.308/claude
          exclude_comments_by_actor: "claude[bot],github-actions[bot]"
