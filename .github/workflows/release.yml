name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run - do not publish or create tag'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(sed -n 's/version = "\([0-9.]\+\)"/\1/p' pyproject.toml)
          echo "Current version: $CURRENT_VERSION"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: calc_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.CURRENT_VERSION }}"
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((major + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$major.$((minor + 1)).0"
              ;;
            patch)
              NEW_VERSION="$major.$minor.$((patch + 1))"
              ;;
            *)
              echo "Invalid bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pyproject.toml with new version using sed
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.CURRENT_VERSION }}"
          NEW_VERSION="${{ steps.calc_version.outputs.NEW_VERSION }}"

          echo "Updating pyproject.toml from $CURRENT_VERSION to $NEW_VERSION"
          sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # Verify the change
          UPDATED_VERSION=$(sed -n 's/version = "\([0-9.]\+\)"/\1/p' pyproject.toml)
          if [ "$UPDATED_VERSION" != "$NEW_VERSION" ]; then
            echo "Failed to update pyproject.toml. Current: $UPDATED_VERSION, Expected: $NEW_VERSION"
            exit 1
          fi
          echo "pyproject.toml updated successfully to $UPDATED_VERSION"

      - name: Update src/tp_trace/version.py with new version using sed
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.CURRENT_VERSION }}"
          NEW_VERSION="${{ steps.calc_version.outputs.NEW_VERSION }}"

          echo "Updating src/tp_trace/version.py from $CURRENT_VERSION to $NEW_VERSION"
          sed -i "s/__version__ = \"$CURRENT_VERSION\"/__version__ = \"$NEW_VERSION\"/" src/tp_trace/version.py

          # Verify the change
          UPDATED_VERSION=$(sed -n 's/__version__ = "\([0-9.]\+\)"/\1/p' src/tp_trace/version.py)
          if [ "$UPDATED_VERSION" != "$NEW_VERSION" ]; then
            echo "Failed to update src/tp_trace/version.py. Current: $UPDATED_VERSION, Expected: $NEW_VERSION"
            exit 1
          fi
          echo "src/tp_trace/version.py updated successfully to $UPDATED_VERSION"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.calc_version.outputs.NEW_VERSION }}"
          CURRENT_VERSION="${{ steps.get_version.outputs.CURRENT_VERSION }}"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add pyproject.toml src/tp_trace/version.py
          git commit -m "chore: Release v$NEW_VERSION

          Bump version from $CURRENT_VERSION to $NEW_VERSION"

          git tag -a "v$NEW_VERSION" -m "Version $NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Build package
        run: |
          uv build

      - name: Validate package
        run: |
          echo "Package files:"
          ls -la dist/

      - name: Publish package (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          uv publish --dry-run

      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: |
          uv publish
