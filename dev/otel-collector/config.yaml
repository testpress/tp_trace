extensions:
  health_check:
    endpoint: 0.0.0.0:13133

# Span-metric semantics match production. Bindings, memory/batch budgets, and
# exporter retry/queue tuning intentionally remain local development values.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]
              labels:
                source: "otelcol-telemetry"
                instance: "dev-collector"
                collector_alias: "dev"

processors:
  memory_limiter:
    check_interval: 500ms
    limit_mib: 256
    spike_limit_mib: 64

  resource/drop_ephemeral:
    attributes:
      - key: service.instance.id
        action: delete
      - key: process.pid
        action: delete
      - key: worker_id
        action: delete

  batch:
    timeout: 1s
    # Limit span count per export: 8192 real application spans exceeded
    # Tempo's 4 MiB OTLP gRPC receive limit after decompression.
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    remote_write_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 1
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      job: "otel-collector"
      instance: "dev-collector"
      collector_alias: "dev"

  prometheusremotewrite/internal:
    endpoint: http://prometheus:9090/api/v1/write
    timeout: 30s
    # The internal pipeline pushes cumulative snapshots of the collector's own
    # metrics. Match the native-metric exporter: bound the retry window and queue
    # so an unreachable Prometheus cannot pin stale snapshots in memory.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    remote_write_queue:
      enabled: true
      queue_size: 2000
      num_consumers: 1
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      job: "otel-collector"
      instance: "dev-collector"
      collector_alias: "dev"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/drop_ephemeral
        - batch
      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/drop_ephemeral
        - batch
      exporters:
        - prometheusremotewrite

    metrics/internal:
      receivers:
        - prometheus/internal
      processors:
        - batch
      exporters:
        - prometheusremotewrite/internal

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: false
                without_units: false
